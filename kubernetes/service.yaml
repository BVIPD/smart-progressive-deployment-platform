
apiVersion: v1
kind: Service
metadata:
  name: ccrg-platform-service
spec:
  type: NodePort
  selector:
    app: ccrg-platform
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: ccrg-platform-canary-service
spec:
  type: ClusterIP
  selector:
    app: ccrg-platform
  ports:
    - port: 8000
      targetPort: 8000
